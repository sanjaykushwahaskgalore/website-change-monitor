name: Uptime check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs a little)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-push
  cancel-in-progress: false

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check sites and email if any are down
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python uptime.py

      - name: Save down/up state when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/uptime-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update uptime state"
            git pull --rebase
            git push
          fi
